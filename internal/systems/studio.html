<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ARIE Systems</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B1437; --ink-2:#1A2444; --quiet:#4B5470; --faint:#8A8878;
  --paper:#FAF9F5; --card:#FFFFFF; --wash:#F1EADC; --wash-2:#E7DCC4;
  --gold:#A8813B; --gold-2:#C19A3E; --line:#E2DCCD; --line-2:#D3CBB6;
  --sans:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}


*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 84px)}
body{margin:0;background:var(--paper);color:var(--ink-2);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.shell{max-width:1060px;margin:0 auto;padding:0 32px 96px}

/* masthead */
.mast{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:26px 0 0}
.mark{width:132px;color:var(--ink);flex:none}
.switch{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px}
.switch button{appearance:none;border:0;background:none;font:inherit;font-size:14px;font-weight:500;color:var(--quiet);
  padding:7px 18px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap}
.switch button b{font-family:var(--serif);font-weight:400;font-size:13px;color:var(--faint)}
.switch button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.switch button[aria-selected="true"] b{color:var(--gold-2)}

/* hero */
.hero{padding:52px 0 26px;border-bottom:1px solid var(--line)}
h1{font-family:var(--serif);font-weight:300;font-size:clamp(40px,7vw,72px);line-height:1;letter-spacing:-.02em;
   margin:0;color:var(--ink)}
h1 .ent{display:block;font-style:italic;color:var(--gold)}
.blurb{max-width:46ch;margin:18px 0 0;color:var(--quiet);font-size:15.5px}

/* search */
.find{position:sticky;top:0;z-index:5;background:var(--paper);padding:18px 0 14px;border-bottom:1px solid var(--line);
      display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.find input{flex:1;min-width:220px;background:transparent;border:0;border-bottom:1.5px solid var(--line-2);
  padding:6px 2px;font-family:var(--serif);font-size:20px;color:var(--ink);font-weight:300}
.find input:focus{outline:none;border-bottom-color:var(--gold)}
.find input::placeholder{color:var(--faint);font-style:italic}
.tally{font-size:13px;color:var(--faint);min-width:0;flex:1 1 auto}
.tally .hint{white-space:normal}
@media (max-width:760px){ .tally .hint{display:none} }
kbd{font-family:var(--sans);font-size:11px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;
    padding:1px 5px;color:var(--faint);background:var(--card)}

/* groups and rows */
.groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:36px 28px;margin-top:8px}
.grp{display:flex;flex-direction:column;padding:26px 0 0;min-width:0}
.grp h2{font-family:var(--serif);font-weight:400;font-size:19px;color:var(--ink);margin:0;line-height:1.25}
.grp .note{font-size:12.5px;color:var(--faint);margin-top:4px;margin-bottom:12px}
.rows{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.row{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 110px;align-items:baseline;gap:4px 14px;
     padding:14px 12px 14px 10px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;
     border-left:2px solid transparent;transition:background .12s ease,border-color .12s ease}
.row .meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;margin-top:2px}
.row .meta .ds{flex:1;min-width:200px}
.row:has(.open:hover),.row:has(.open:focus-visible){background:var(--wash);border-left-color:var(--gold)}
.row.nolink{background:transparent}
.open{color:inherit;text-decoration:none}
.open::after{content:"";position:absolute;inset:0}
.ct{position:relative;z-index:1;display:block;margin-top:5px;padding:0;border:0;background:none;font:inherit;
    font-size:12.5px;color:var(--gold);text-align:left;cursor:copy;width:fit-content;max-width:100%}
.ct::before{content:"Contact ";color:var(--faint)}
.ct:hover{text-decoration:underline;text-underline-offset:3px}
.ct.done{color:var(--quiet)}
.ct.done::before{content:"Copied "}
.row .nm{font-family:var(--serif);font-size:18px;font-weight:400;color:var(--ink);line-height:1.25}
.row .ds{font-size:13px;color:var(--quiet);line-height:1.5}
.row .tag{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
          justify-self:end;text-align:right;word-break:break-word;overflow-wrap:anywhere;max-width:100%}
.row .tag.staff{color:var(--gold)}
.row .tag.client{color:#5b6b85}
.row .tag.unavail{color:var(--faint);font-style:italic;text-transform:none;letter-spacing:0}
.row:has(.open:hover) .tag,.row:has(.open:focus-visible) .tag{color:var(--gold)}
.row.nolink{background:transparent}
.chartcard{margin:24px 0 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 18px}
.chartcard svg{display:block;width:100%;height:auto}
.key{display:flex;gap:26px;flex-wrap:wrap;margin:24px 0 0;font-size:13.5px;color:var(--quiet)}
.key span{display:flex;align-items:center;gap:9px}
.key i{width:14px;height:14px;border-radius:4px;display:inline-block}
.k-auto{background:#EDF1F8;border:1px solid #C9D4E8}
.k-manual{background:var(--wash);border:1px solid var(--line-2)}
.sec{margin:42px 0 0;padding-top:24px;border-top:1px solid var(--line)}
.sec h2{font-family:var(--serif);font-weight:300;font-size:clamp(22px,3vw,30px);margin:0;color:var(--ink)}
.sec p{max-width:56ch;color:var(--quiet);margin:10px 0 0}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:26px}
.note-c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.note-c.beige{background:var(--wash);border-color:var(--line-2)}
.note-c h3{font-family:var(--serif);font-weight:400;font-size:18px;margin:0 0 6px;color:var(--ink)}
.note-c p{margin:0;font-size:13.5px;color:var(--quiet)}
.blank{padding:26px 2px;color:var(--faint);font-size:14.5px;border-bottom:1px solid var(--line)}

/* Useful links */
.useful{margin-top:48px;padding-top:28px;border-top:1px solid var(--line)}
.useful h2{font-family:var(--serif);font-weight:400;font-size:19px;color:var(--ink);margin:0 0 4px;line-height:1.25}
.useful .note{font-size:12.5px;color:var(--faint);margin-bottom:12px}
.useful ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 24px}
.useful li{padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.useful a{color:var(--ink);text-decoration:none;border-bottom:1px dashed var(--line-2);padding-bottom:1px}
.useful a:hover{border-bottom-color:var(--gold);color:var(--gold)}
.useful .tag{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-left:6px}

/* Secondary actions (Payment guide) */
.aside{margin-top:36px;padding-top:24px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap}
.aside .btn{appearance:none;border:1px solid var(--line-2);background:var(--card);color:var(--ink);
            padding:9px 16px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer;
            display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.aside .btn:hover{border-color:var(--gold);color:var(--gold)}
.aside .btn[aria-expanded="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
#guide-panel{display:none;margin-top:16px}
#guide-panel[hidden]{display:none!important}
.guide-open #guide-panel{display:block}

footer{margin-top:64px;padding-top:16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;
       gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--faint)}

@media (max-width:900px){
  .groups{grid-template-columns:1fr;gap:28px}
  .useful ul{grid-template-columns:1fr}
}
@media (max-width:760px){
  .shell{padding:0 20px 64px}
  .mast{flex-direction:column;align-items:flex-start;gap:16px}
  .hero{padding:32px 0 20px}
  .row{grid-template-columns:1fr;padding:14px 10px}
  .row .tag{justify-self:start;text-align:left;margin-top:2px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

    <div class="switch" role="tablist" aria-label="Entity">
      <button role="tab" id="tab-arie" aria-controls="list" aria-selected="true">ARIE Finance</button>
      <button role="tab" id="tab-acbm" aria-controls="list" aria-selected="false">ACBM</button>
    </div>
  </div>

  <header class="hero">
    <h1>Systems for<span class="ent" id="entName">ARIE Finance</span></h1>
    <p class="blurb">Every platform the team signs into, grouped by what you are trying to do. Pick one and it opens in a new tab.</p>
  </header>

  <div class="find">
    <input id="q" type="search" placeholder="Search by name, job or address" aria-label="Search systems" autocomplete="off">
    <span class="tally"><span id="tally"></span><span class="hint">. Press <kbd>/</kbd> to search, <kbd>Enter</kbd> to open the first result.</span></span>
  </div>

  <main id="list" role="tabpanel" aria-labelledby="tab-arie"></main>

  <section class="useful" id="useful" aria-labelledby="useful-h">

    <button class="btn" type="button" id="guide-btn" aria-expanded="false" aria-controls="guide-panel">Payment guide</button>

    <span>Internal directory. Access to each system is granted separately.</span>

<script>
const MAUBANK = 'https://ib.maubank.mu/corp/AuthenticationController?__START_TRAN_FLAG__=Y&FORMSGROUP_ID__=AuthenticationFG&__EVENT_ID__=LOAD&FG_BUTTONS__=LOAD&ACTION.LOAD=Y&AuthenticationFG.LOGIN_FLAG=1&BANK_ID=12&LANGUAGE_ID=001';
const KYC = { name:'KYC Portal back office', url:'https://backoffice.bankonboarding.com/',
              desc:'Open an application file for a client being onboarded' };
const ACCUITY = { name:'Accuity', url:'https://accuity.worldcompliance.com/SignIn.aspx?ReturnUrl=%2f',
                  desc:'Screen clients and counterparties against sanctions, PEP and adverse media lists' };
const MAU = { name:'MauBank', url:MAUBANK, desc:'Corporate internet banking' };
const XERO = { name:'Xero', url:'https://login.xero.com/identity/user/login',
               desc:'Bookkeeping, invoicing and the monthly management figures' };

/* Shared individual tools (referenced from both company mappings where applicable). */
const SAASCADA = { name:'Saascada', url:'https://portal.ariefinance.saascada.io/login',
                   desc:'Core back office for client accounts and payments',
                   contact:{ name:'Thomas Connelly', email:'thomas@saascada.com' } };
const ALLICA   = { name:'Allica payment platform', desc:'Payment platform delivered with Aicura Solutions',
                   contact:{ name:'Hussain Kothari', email:'hussain@aicurasolutions.com' } };
const THUNES   = { name:'Thunes', url:'https://businesshub.thunes.com/#/main/network',
                   desc:'Back office for payments routed through Thunes' };
const COMPLY   = { name:'ComplyAdvantage', url:'https://arie-finance.tm.complyadvantage.com/',
                   desc:'Review transactions that have been flagged or put on hold',
                   contact:{ name:'Freya Savage', email:'freya.savage@complyadvantage.com' } };
const AFRASIA  = { name:'AfrAsia Bank', url:'https://onlinebanking.afrasiabank.com/en/auth/login',
                   desc:'Corporate internet banking' };
const MERCURY  = { name:'Mercury', url:'https://portal.mercury.global/login',
                   desc:'Corporate banking portal' };
const ACBMBO   = { name:'ACBM back office', url:'https://backoffice.acbm.mu/',
                   desc:'Client accounts and payments for ACBM' };
const SCV      = { name:'Onboarding SCV', url:'https://scv.ariefinance.com/home',
                   desc:'Issue client credentials once onboarding is approved' };
const SALES    = { name:'Sales tracker', url:'https://www.ariefinance.com/salestracker',
                   desc:'Track leads, opportunities and outreach activity' };
const REGBO    = { name:'RegMind Back Office', url:'https://onboarding.ariefinance.com/backoffice',
                   desc:'Review and manage onboarding applications', audience:'staff' };
const REGPT    = { name:'RegMind Portal', url:'https://onboarding.ariefinance.com/portal',
                   desc:'Start an application or sign in to the client portal', audience:'client' };
const ONLINEBK = { name:'ARIE Online Banking', url:'https://online.ariefinance.com/online-banking',
                   desc:'Client access to online banking', audience:'client' };
const ONBREQ   = { name:'Onboarding requirements', url:'/onboarding-requirements/',
                   desc:'Customer onboarding requirements reference' };
const WIRE     = { name:'MauBank wire-transfer utility', url:'/internal/wire-transfer/',
                   desc:'Turn a cross-border request email into a filled MauBank TT PDF' };
const TTINST   = { name:'MauBank TT Instruction', url:'/internal/tt/',
                   desc:'Prepare MauBank TT instructions' };
const STATES   = { name:'Statement generator', url:'/internal/statements/',
                   desc:'Produce client statements from transaction data' };
const HOLIDAYS = { name:'Holidays Announcement', url:'/internal/holidays/',
                   desc:'Draft ARIE holiday / out-of-office notices' };
const MGMTRPT  = { name:'Management Report Builder', url:'/managementreport/',
                   desc:'Produce the monthly management report' };
const PUB      = { name:'Insights Publisher', url:'/insights/admin/',
                   desc:'Publish and edit Insights articles' };
const EMAILHLP = { name:'Prepare article email', url:'/insights/_email-helper.html',
                   desc:'Enter a published article’s title, summary and URL to produce a client email.' };
const PRICING_ARIE = { name:'Pricing and welcome pack generator', url:'https://www.ariefinance.com/internal/pricing',
                       desc:'Build client pricing and produce the welcome pack' };
const PRICING_ACBM = { name:'Pricing / Fee Schedule', url:'https://www.ariefinance.com/internal/pricing',
                       desc:'Build the ACBM Fee Schedule (no Welcome Pack under ACBM).' };

/* Six task groups per entity. Only populated groups render. */
const DATA = {
  arie: { label:'ARIE Finance', groups:[
    { name:'Client onboarding', items:[ REGBO, REGPT, KYC, SCV, ONBREQ ] },
    { name:'Payments & banking', items:[ SAASCADA, ALLICA, THUNES, MAU, WIRE, TTINST, ONLINEBK ] },
    { name:'Compliance',         items:[ ACCUITY, COMPLY ] },
    { name:'Sales & pricing',    items:[ SALES, PRICING_ARIE ] },
    { name:'Finance & reporting',items:[ XERO, STATES, MGMTRPT ] },
    { name:'Communications',     items:[ HOLIDAYS, PUB, EMAILHLP ] }
  ]},
  acbm: { label:'ACBM', groups:[
    { name:'Client onboarding', items:[ KYC ] },
    { name:'Payments & banking', items:[ ACBMBO, AFRASIA, MERCURY, MAU, TTINST ] },
    { name:'Compliance',         items:[ ACCUITY ] },
    { name:'Sales & pricing',    items:[ PRICING_ACBM ] },
    { name:'Finance & reporting',items:[ XERO ] }
  ]}
};

/* Useful links. "both" shows under either company; "arie" ARIE only. */
const USEFUL = [
  { company:'arie', name:'Corporate Onboarding Pack', url:'/documents/ARIE_Finance_Corporate_Onboarding_Pack.pdf', tag:'download' },

const entity = () => document.querySelector('.switch [aria-selected="true"]').id.slice(4);
let firstHit = null;

/* Practical search synonyms per V2 \u00a74. */
const SYNONYMS = {
  tt:'tt instruction maubank transfer wire',
  transfer:'tt instruction wire transfer maubank',
  statement:'statement statements statement generator',
  pricing:'pricing fee schedule welcome pack',
  onboarding:'onboarding regmind kyc scv requirements'
};
function hay(it){
  return [ it.name, it.desc, it.url ? host(it.url) : '',
           it.contact ? it.contact.name + ' ' + it.contact.email : '' ].join(' ').toLowerCase();
}
function matches(it, f){
  if (!f) return true;
  const h = hay(it);
  const terms = ((SYNONYMS[f.toLowerCase().trim()] || f).toLowerCase().split(/\s+/)).filter(Boolean);
  return terms.some(t => h.includes(t));
}
function audienceTag(it){
  if (it.audience === 'staff')  return '<span class="tag staff">Staff</span>';
  if (it.audience === 'client') return '<span class="tag client">Client-facing</span>';
  if (!it.url)                  return '<span class="tag unavail">Link unavailable</span>';
  return '';
}

function paint(){
  const key = entity();
  const d = DATA[key];
  document.querySelector('.hero h1').innerHTML = 'Systems for<span class="ent">' + esc(d.label) + '</span>';
  document.querySelector('.blurb').textContent =
    'Every platform the team signs into, grouped by what you are trying to do. Pick one and it opens in a new tab.';
  const f = document.getElementById('q').value.trim();
  let shown = 0, total = 0; firstHit = null;
  const html = d.groups.map(g => {
    total += g.items.length;
    const items = g.items.filter(it => matches(it, f));
    if (!items.length) return '';
    if (!firstHit) firstHit = items.find(it => it.url)?.url || null;
    shown += items.length;
    return `<section class="grp"><h2>${esc(g.name)}</h2>
      <div class="rows">${items.map(it => `
        <div class="row${it.url ? '' : ' nolink'}">
          <span class="nm">${it.url
            ? `<a class="open" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">${esc(it.name)}</a>`
            : esc(it.name)}</span>
          <span class="tag">${audienceTag(it) || (it.url ? esc(host(it.url)) : '')}</span>
          <div class="meta"><span class="ds">${esc(it.desc)}</span>${it.contact ? `
            <button class="ct" type="button" data-email="${esc(it.contact.email)}"
              title="Click to copy the address">${esc(it.contact.name)}, ${esc(it.contact.email)}</button>` : ''}</div>
        </div>`).join('')}</div></section>`;
  }).join('');
  /* Useful links: ARIE-only items hidden under ACBM; "both" always shown. */
  const uTotal = USEFUL.filter(u => u.company === 'both' || u.company === key).length;
  const uItems = USEFUL.filter(u => (u.company === 'both' || u.company === key) && matches(u, f));
  document.getElementById('useful').style.display = uItems.length ? '' : 'none';
  document.getElementById('useful-note').textContent =
    key === 'arie' ? 'Supporting resources for ARIE Finance.' : 'Supporting resources for ACBM.';
  document.getElementById('useful-list').innerHTML = uItems.map(u =>
    `<li><a href="${esc(u.url)}" target="_blank" rel="noopener noreferrer">${esc(u.name)}</a>${u.tag ? ` <span class="tag">${esc(u.tag)}</span>` : ''}</li>`).join('');
  const list = document.getElementById('list');
  if (html) {
    list.innerHTML = '<div class="groups">' + html + '</div>';
  } else if (!uItems.length) {
    list.innerHTML = `<p class="blank">Nothing in ${esc(d.label)} matches \u201c${esc(f)}\u201d. <button type="button" id="clearq" class="btn" style="margin-left:6px;padding:4px 10px;font-size:12px">Clear search</button></p>`;
  } else {
    list.innerHTML = '';
  }
  document.getElementById('tally').textContent = f
    ? `${shown + uItems.length} of ${total + uTotal} entries`
    : `${total + uTotal} entries`;
  document.title = 'Systems \u2014 ' + d.label;
}

document.querySelectorAll('.switch button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.switch button').forEach(x => x.setAttribute('aria-selected', x === b));
  document.getElementById('list').setAttribute('aria-labelledby', b.id);
  /* Preserve search query when switching company (V2 §4). */
  paint();
}));

(function(){
  const btn = document.getElementById('guide-btn');
  const panel = document.getElementById('guide-panel');
  btn.addEventListener('click', () => {
    const open = btn.getAttribute('aria-expanded') === 'true';
    if (open) { btn.setAttribute('aria-expanded', 'false'); panel.hidden = true; return; }
    if (!panel.innerHTML) panel.innerHTML = FLOW_HTML;
    btn.setAttribute('aria-expanded', 'true');
    panel.hidden = false;
    panel.scrollIntoView({ behavior:'smooth', block:'start' });
  });
})();

/* Delegated Clear-search button rendered by the empty state. */
document.addEventListener('click', e => {
  if (e.target && e.target.id === 'clearq') { q.value = ''; paint(); q.focus(); }
});
const q = document.getElementById('q');
q.addEventListener('input', paint);
q.addEventListener('keydown', e => {
  if (e.key === 'Enter' && firstHit) window.open(firstHit, '_blank', 'noopener');
  if (e.key === 'Escape') { q.value = ''; paint(); }
});
document.addEventListener('click', e => {
  const b = e.target.closest('.ct');
  if (!b) return;
  e.preventDefault();
  const mail = b.dataset.email, label = b.textContent;
  const done = () => { b.classList.add('done'); setTimeout(() => b.classList.remove('done'), 1600); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(mail).then(done, () => fallback(mail, done));
  } else { fallback(mail, done); }
});
function fallback(text, done){
  const t = document.createElement('textarea');
  t.value = text; t.setAttribute('readonly',''); t.style.cssText = 'position:fixed;top:-100px;opacity:0';
  document.body.appendChild(t); t.select();
  try { document.execCommand('copy'); done(); } catch(err) {}
  t.remove();
}
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); }
});
paint();
