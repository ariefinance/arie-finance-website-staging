<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ARIE Finance — Systems (Copy)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B1437; --ink-2:#1A2444; --quiet:#4B5470; --faint:#8A8878;
  --paper:#FAF9F5; --card:#FFFFFF; --wash:#F1EADC; --wash-2:#E7DCC4;
  --gold:#A8813B; --gold-2:#C19A3E; --line:#E2DCCD; --line-2:#D3CBB6;
  --sans:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}


*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 84px)}
body{margin:0;background:var(--paper);color:var(--ink-2);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.shell{max-width:1060px;margin:0 auto;padding:0 32px 96px}

/* masthead */
.mast{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:26px 0 0}
.mark{width:132px;color:var(--ink);flex:none}
.switch{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px}
.switch button{appearance:none;border:0;background:none;font:inherit;font-size:14px;font-weight:500;color:var(--quiet);
  padding:7px 18px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap}
.switch button b{font-family:var(--serif);font-weight:400;font-size:13px;color:var(--faint)}
.switch button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.switch button[aria-selected="true"] b{color:var(--gold-2)}

/* hero */
.hero{padding:52px 0 26px;border-bottom:1px solid var(--line)}
h1{font-family:var(--serif);font-weight:300;font-size:clamp(40px,7vw,72px);line-height:1;letter-spacing:-.02em;
   margin:0;color:var(--ink)}
h1 .ent{display:block;font-style:italic;color:var(--gold)}
.blurb{max-width:46ch;margin:18px 0 0;color:var(--quiet);font-size:15.5px}

/* search */
.find{position:sticky;top:0;z-index:5;background:var(--paper);padding:18px 0 14px;border-bottom:1px solid var(--line);
      display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.find input{flex:1;min-width:220px;background:transparent;border:0;border-bottom:1.5px solid var(--line-2);
  padding:6px 2px;font-family:var(--serif);font-size:20px;color:var(--ink);font-weight:300}
.find input:focus{outline:none;border-bottom-color:var(--gold)}
.find input::placeholder{color:var(--faint);font-style:italic}
.tally{font-size:13px;color:var(--faint);white-space:nowrap}
kbd{font-family:var(--sans);font-size:11px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;
    padding:1px 5px;color:var(--faint);background:var(--card)}

/* groups and rows */
.grp{display:grid;grid-template-columns:172px 1fr;gap:0 28px;padding:34px 0 0}
.grp h2{font-family:var(--serif);font-weight:400;font-size:19px;color:var(--ink);margin:14px 0 0;
        position:sticky;top:76px;align-self:start;line-height:1.25}
.grp .note{font-size:12.5px;color:var(--faint);margin-top:4px}
.rows{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.row{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) 195px;align-items:baseline;gap:6px 22px;
     padding:15px 14px 15px 12px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;
     border-left:2px solid transparent;transition:background .12s ease,border-color .12s ease}
.row:has(.open:hover),.row:has(.open:focus-visible){background:var(--wash);border-left-color:var(--gold)}
.row.nolink{background:transparent}
.open{color:inherit;text-decoration:none}
.open::after{content:"";position:absolute;inset:0}
.ct{position:relative;z-index:1;display:block;margin-top:5px;padding:0;border:0;background:none;font:inherit;
    font-size:12.5px;color:var(--gold);text-align:left;cursor:copy;width:fit-content;max-width:100%}
.ct::before{content:"Contact ";color:var(--faint)}
.ct:hover{text-decoration:underline;text-underline-offset:3px}
.ct.done{color:var(--quiet)}
.ct.done::before{content:"Copied "}
.row .nm{font-family:var(--serif);font-size:22px;font-weight:400;color:var(--ink);line-height:1.2}
.row .ds{font-size:13.5px;color:var(--quiet)}
.row .hs{font-size:12px;color:var(--faint);justify-self:end;text-align:right;word-break:break-word}
.row:has(.open:hover) .hs,.row:has(.open:focus-visible) .hs{color:var(--gold)}
.row.nolink .hs{font-style:italic}
.chartcard{margin:24px 0 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 18px}
.chartcard svg{display:block;width:100%;height:auto}
.key{display:flex;gap:26px;flex-wrap:wrap;margin:24px 0 0;font-size:13.5px;color:var(--quiet)}
.key span{display:flex;align-items:center;gap:9px}
.key i{width:14px;height:14px;border-radius:4px;display:inline-block}
.k-auto{background:#EDF1F8;border:1px solid #C9D4E8}
.k-manual{background:var(--wash);border:1px solid var(--line-2)}
.sec{margin:42px 0 0;padding-top:24px;border-top:1px solid var(--line)}
.sec h2{font-family:var(--serif);font-weight:300;font-size:clamp(22px,3vw,30px);margin:0;color:var(--ink)}
.sec p{max-width:56ch;color:var(--quiet);margin:10px 0 0}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:26px}
.note-c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.note-c.beige{background:var(--wash);border-color:var(--line-2)}
.note-c h3{font-family:var(--serif);font-weight:400;font-size:18px;margin:0 0 6px;color:var(--ink)}
.note-c p{margin:0;font-size:13.5px;color:var(--quiet)}
.blank{padding:26px 2px;color:var(--faint);font-size:14.5px;border-bottom:1px solid var(--line)}

footer{margin-top:64px;padding-top:16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;
       gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--faint)}
footer span:last-child{color:var(--gold)}

@media (max-width:900px){
  .row{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) 150px}
}
@media (max-width:760px){
  .shell{padding:0 20px 64px}
  .mast{flex-direction:column;align-items:flex-start;gap:16px}
  .hero{padding:32px 0 20px}
  .grp{grid-template-columns:1fr;gap:0}
  .grp h2{position:static;margin:0 0 10px}
  .row{grid-template-columns:1fr;padding:14px 10px}
  .row .hs{justify-self:start;text-align:left;margin-top:4px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

      <text class="su" x="380" y="342" text-anchor="middle" dominant-baseline="central">Screened and monitored automatically</text>
      <line class="fl" x1="380" y1="358" x2="380" y2="382" marker-end="url(#ar)"/>

      <text class="st" x="200" y="376">STEP 5</text>
      <rect class="bx-auto" x="200" y="384" width="360" height="62" rx="10"/>
      <text class="ti" x="380" y="410" text-anchor="middle" dominant-baseline="central">Saascada routes the payment</text>
      <text class="su" x="380" y="430" text-anchor="middle" dominant-baseline="central">By currency and destination country</text>

      <path class="fl" d="M380 446 V478 H210 V500" marker-end="url(#ar)"/>
      <path class="fl" d="M380 446 V478 H550 V500" marker-end="url(#ar)"/>

      <text class="st" x="70" y="498">AUTOMATIC ROUTE</text>
      <rect class="bx-auto" x="70" y="508" width="280" height="62" rx="10"/>
      <text class="ti" x="210" y="534" text-anchor="middle" dominant-baseline="central">Thunes</text>
      <text class="su" x="210" y="554" text-anchor="middle" dominant-baseline="central">Payment goes out automatically</text>

      <text class="st" x="410" y="498">MANUAL ROUTE</text>
      <rect class="bx-man" x="410" y="508" width="280" height="62" rx="10"/>
      <text class="ti" x="550" y="534" text-anchor="middle" dominant-baseline="central">Email to customer care</text>
      <text class="su" x="550" y="554" text-anchor="middle" dominant-baseline="central">Payment details sent to the team</text>
      <line class="fl" x1="550" y1="570" x2="550" y2="594" marker-end="url(#ar)"/>

      <rect class="bx-man" x="410" y="604" width="280" height="62" rx="10"/>
      <text class="ti" x="550" y="630" text-anchor="middle" dominant-baseline="central">MauBank manual payment</text>
      <text class="su" x="550" y="650" text-anchor="middle" dominant-baseline="central">Officer completes the form and processes</text>
    </svg></div>
<section class="sec">
  <h2>What the officer checks afterwards</h2>
  <p>Two checks sit outside the automatic flow. Both are done by the officer on the day, not by the system.</p>
</section>
<div class="chartcard"><svg viewBox="0 0 760 300" role="img" xmlns="http://www.w3.org/2000/svg">
      <title>Officer checks after a payment is sent</title>
      <desc>The officer checks Thunes to confirm each payment was released, and checks ComplyAdvantage for payments on hold, handling soft stops where the payment is released but flagged and hard stops where the payment is blocked.</desc>
      <text class="st" x="40" y="24">CHECK 1</text>
      <rect class="bx-man" x="40" y="32" width="330" height="58" rx="10"/>
      <text class="ti" x="205" y="56" text-anchor="middle" dominant-baseline="central">Thunes</text>
      <text class="su" x="205" y="76" text-anchor="middle" dominant-baseline="central">Was the payment released?</text>
      <line class="fl" x1="205" y1="90" x2="205" y2="112" marker-end="url(#ar2)"/>

      <rect class="bx" x="40" y="122" width="330" height="62" rx="10"/>
      <text class="ti" x="205" y="148" text-anchor="middle" dominant-baseline="central">Released</text>
      <text class="su" x="205" y="168" text-anchor="middle" dominant-baseline="central">No action needed</text>

      <rect class="bx-man" x="40" y="196" width="330" height="62" rx="10"/>
      <text class="ti" x="205" y="222" text-anchor="middle" dominant-baseline="central">Failed</text>
      <text class="su" x="205" y="242" text-anchor="middle" dominant-baseline="central">Officer attends; client uploads it again</text>

      <text class="st" x="390" y="24">CHECK 2</text>
      <rect class="bx-man" x="390" y="32" width="330" height="58" rx="10"/>
      <text class="ti" x="555" y="56" text-anchor="middle" dominant-baseline="central">ComplyAdvantage</text>
      <text class="su" x="555" y="76" text-anchor="middle" dominant-baseline="central">Anything on hold?</text>
      <line class="fl" x1="555" y1="90" x2="555" y2="112" marker-end="url(#ar2)"/>

      <rect class="bx-man" x="390" y="122" width="330" height="62" rx="10"/>
      <text class="ti" x="555" y="148" text-anchor="middle" dominant-baseline="central">Soft stop</text>
      <text class="su" x="555" y="168" text-anchor="middle" dominant-baseline="central">Released but flagged; officer reviews</text>

      <rect class="bx-man" x="390" y="196" width="330" height="62" rx="10"/>
      <text class="ti" x="555" y="222" text-anchor="middle" dominant-baseline="central">Hard stop</text>
      <text class="su" x="555" y="242" text-anchor="middle" dominant-baseline="central">Payment blocked; officer attends</text>
      <defs>
        <marker id="ar2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M2 1L8 5L2 9" fill="none" stroke="#9A957F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
      </defs>
      <style>
        .bx{fill:#FFFFFF;stroke:#D2CAB5;stroke-width:1}
        .bx-man{fill:#F3EEE2;stroke:#D9CDB0;stroke-width:1}
        .ti{font-family:"Newsreader",Georgia,serif;font-size:18px;fill:#0B1437}
        .su{font-family:"Hanken Grotesk",Arial,sans-serif;font-size:12.5px;fill:#4E5773}
        .st{font-family:"Hanken Grotesk",Arial,sans-serif;font-size:11px;fill:#8A8878;letter-spacing:.12em}

<div class="notes">
    <div class="note-c">
      <h3>Where the hand-off happens</h3>
      <p>Steps 2 to 5 run without anyone touching them. The first point at which an officer is needed is the email to customercare@ariefinance.com on the manual route, and then the two checks below.</p>
    </div>
    <div class="note-c">
      <h3>What decides the route</h3>
      <p>Saascada filters each payment on currency and destination country. Corridors supported by Thunes go out automatically; everything else becomes a manual MauBank payment.</p>
    </div>
    <div class="note-c beige">
      <h3>Soft stop and hard stop</h3>
      <p>A soft stop means the payment is released but flagged, so the officer reviews it after the fact. A hard stop means the payment does not go through at all until the officer deals with it.</p>
    </div>
  </div>`;
const entity = () => document.querySelector('.switch [aria-selected="true"]').id.slice(4);
let firstHit = null;

function paint(){
  const key = entity();
  const isFlow = key === 'flow';
  document.querySelector('.find').style.display = isFlow ? 'none' : '';
  document.querySelector('.hero h1').innerHTML = isFlow
    ? 'Payment<span class="ent">workflow</span>'
    : 'Systems for<span class="ent">' + esc(DATA[key].label) + '</span>';
  document.querySelector('.blurb').textContent = isFlow
    ? 'How a payment travels from the client\u2019s upload to the beneficiary, and the points where an officer has to step in.'
    : 'Every platform the team signs into, grouped by what you are trying to do. Pick one and it opens in a new tab.';
  if (isFlow) {
    document.getElementById('list').innerHTML = FLOW_HTML;
    document.title = 'Payment workflow \u2014 ARIE Finance';
    return;
  }
  const d = DATA[key];
  const f = document.getElementById('q').value.trim().toLowerCase();
  const match = it => !f || (it.name + ' ' + it.desc + ' ' + (it.url ? host(it.url) : '') + ' ' +
    (it.contact ? it.contact.name + ' ' + it.contact.email : '')).toLowerCase().includes(f);
  let shown = 0; firstHit = null;
  const html = d.groups.map(g => {
    const items = g.items.filter(match);
    if (!items.length) return '';
    if (!firstHit) firstHit = items.find(it => it.url)?.url || null;
    shown += items.length;
    return `<section class="grp"><div><h2>${esc(g.name)}</h2><div class="note">${esc(g.note)}</div></div>
      <div class="rows">${items.map(it => `
        <div class="row${it.url ? '' : ' nolink'}">
          <span class="nm">${it.url
            ? `<a class="open" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">${esc(it.name)}</a>`
            : esc(it.name)}</span>
          <span class="ds">${esc(it.desc)}${it.contact ? `
            <button class="ct" type="button" data-email="${esc(it.contact.email)}"
              title="Click to copy the address">${esc(it.contact.name)}, ${esc(it.contact.email)}</button>` : ''}</span>
          <span class="hs">${it.url ? esc(host(it.url)) : 'Link to follow'}</span>
        </div>`).join('')}</div></section>`;
  }).join('');
  document.getElementById('list').innerHTML = html ||
    `<p class="blank">No system here matches “${esc(f)}”. Try the other entity, or clear the search.</p>`;
  const total = d.groups.reduce((a, g) => a + g.items.length, 0);
  document.getElementById('tally').textContent = f ? `${shown} of ${total} systems` : `${total} systems`;
  document.title = 'Systems — ' + d.label;
}

document.querySelectorAll('.switch button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.switch button').forEach(x => x.setAttribute('aria-selected', x === b));
  document.getElementById('list').setAttribute('aria-labelledby', b.id);
  paint();
}));
const q = document.getElementById('q');
q.addEventListener('input', paint);
q.addEventListener('keydown', e => {
  if (e.key === 'Enter' && firstHit) window.open(firstHit, '_blank', 'noopener');
  if (e.key === 'Escape') { q.value = ''; paint(); }
});
document.addEventListener('click', e => {
  const b = e.target.closest('.ct');
  if (!b) return;
  e.preventDefault();
  const mail = b.dataset.email, label = b.textContent;
  const done = () => { b.classList.add('done'); setTimeout(() => b.classList.remove('done'), 1600); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(mail).then(done, () => fallback(mail, done));
  } else { fallback(mail, done); }
});
function fallback(text, done){
  const t = document.createElement('textarea');
  t.value = text; t.setAttribute('readonly',''); t.style.cssText = 'position:fixed;top:-100px;opacity:0';
  document.body.appendChild(t); t.select();
  try { document.execCommand('copy'); done(); } catch(err) {}
  t.remove();
}
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); }
});
paint();
</script>
</body>
