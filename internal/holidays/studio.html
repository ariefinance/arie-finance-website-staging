document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

{position:static !important}}\n@media(max-width:580px){.arie-workspace{padding:14px 10px !important;gap:16px !important}}\n<\u002Fstyle>\n<\u002Fhelmet>\n<!-- Top bar -->\n<div style=\"background:#091626;border-bottom:1px solid #1e3350\">\n<div style=\"max-width:1400px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px\">\n<div style=\"display:flex;align-items:center;gap:14px\">\n<div style=\"height:30px;width:30px;border:1px solid #c5a572;border-radius:4px;display:flex;align-items:center;justify-content:center;font:18px/1 'Playfair Display',Georgia,serif;color:#e0c89a\">A<\u002Fdiv>\n<div>\n<div style=\"font-size:11px;letter-spacing:3.5px;color:white;font-weight:800\">ARIE FINANCE<\u002Fdiv>\n<div style=\"font-size:8px;letter-spacing:2px;color:#8fa0b4;text-transform:uppercase;margin-top:1px\">Correspondence Studio<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-size:9px;color:#7a8da3;letter-spacing:1.5px;text-transform:uppercase\">Holiday Notice<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<!-- Workspace -->\n<div class=\"arie-workspace\" style=\"max-width:1400px;padding:24px;margin:auto;display:grid;grid-template-columns:minmax(320px,380px) minmax(560px,1fr);gap:22px;align-items:start\">\n<!-- EDITOR -->\n<div style=\"background:white;border-radius:10px;border:1px solid #dde3ea;box-shadow:0 8px 30px rgba(11,24,44,.04);overflow:hidden\">\n<div style=\"padding:20px 22px 16px;border-bottom:1px solid #edf0f3\">\n<div style=\"color:#c5a572;text-transform:uppercase;letter-spacing:2.5px;font-size:9px;font-weight:800\">Prepare your announcement<\u002Fdiv>\n<div style=\"font:normal 22px/1.2 'Playfair Display','Playfair Display',Georgia,serif;color:#0B1829;letter-spacing:-.4px;margin:10px 0 8px\">Select a holiday and enter dates.<\u002Fdiv>\n<div style=\"color:#6c7a8b;font-size:11px;line-height:1.6\">The email updates live. Copy when ready.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:6px 22px 8px\">\n<!-- ESSENTIAL: Holiday + Dates -->\n<fieldset style=\"border:0;margin:14px 0 18px;padding:0\">\n<legend style=\"padding:0;display:block;width:100%;border-bottom:1px solid #e9ebee;padding-bottom:7px;margin-bottom:12px;color:#1a2f46;font-weight:800;font-size:10px;letter-spacing:1.8px;text-transform:uppercase\">Holiday &amp; dates<\u002Flegend>\n<div style=\"margin-bottom:10px\">\n<label style=\"display:block;font-weight:700;color:#2b4057;font-size:10.5px;margin-bottom:4px\">Mauritius public holiday<\u002Flabel>\n<sc-raw-select value=\"{{ occasion }}\" sc-camel-on-change=\"{{ onOccasionChange }}\" style=\"width:100%;border:1px solid #d7dfe7;border-radius:5px;background:#fff;color:#23374e;outline:0;padding:9px 10px;font-size:12px;min-height:38px;cursor:pointer;font-family:inherit\">\n<option value=\"\">Choose a holiday…<\u002Foption>\n<option value=\"New Year\">New Year<\u002Foption>\n<option value=\"Abolition of Slavery\">Abolition of Slavery<\u002Foption>\n<option value=\"Thaipoosam Cavadee\">Thaipoosam Cavadee<\u002Foption>\n<option value=\"Maha Shivaratree\">Maha Shivaratree<\u002Foption>\n<option value=\"Chinese Spring Festival\">Chinese Spring Festival<\u002Foption>\n<option value=\"Independence Day and Republic Day\">Independence Day and Republic Day<\u002Foption>\n<option value=\"Ugaadi\">Ugaadi<\u002Foption>\n<option value=\"Eid-Ul-Fitr\">Eid-Ul-Fitr<\u002Foption>\n<option value=\"Labour Day\">Labour Day<\u002Foption>\n<option value=\"Assumption of the Blessed Virgin Mary\">Assumption of the Blessed Virgin Mary<\u002Foption>\n<option value=\"Ganesh Chaturthi\">Ganesh Chaturthi<\u002Foption>\n<option value=\"Divali\">Divali<\u002Foption>\n<option value=\"All Saints' Day\">All Saints' Day<\u002Foption>\n<option value=\"Arrival of Indentured Labourers\">Arrival of Indentured Labourers<\u002Foption>\n<option value=\"Christmas\">Christmas<\u002Foption>\n<option value=\"Other\">Other officially declared holiday / closure<\u002Foption>\n<\u002Fsc-raw-select>\n<\u002Fdiv>\n<sc-if value=\"{{ showCustom }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"margin-bottom:10px\">\n<label style=\"display:block;font-weight:700;color:#2b4057;font-size:10.5px;margin-bottom:4px\">Custom name<\u002Flabel>\n<input type=\"text\" value=\"{{ customOccasion }}\" sc-camel-on-change=\"{{ onCustomOccasionChange }}\" placeholder=\"Enter the official name\" style=\"width:100%;border:1px solid #d7dfe7;border-radius:5px;background:#fff;color:#23374e;outline:0;padding:9px 10px;font-size:12px;min-height:37px;font-family:inherit;box-sizing:border-box\">\n<\u002Fdiv>\n<\u002Fsc-if>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px\">\n<div>\n<label style=\"display:block;font-weight:700;color:#2b4057;font-size:10.5px;margin-bottom:4px\">Office closed *<\u002Flabel>\n<input type=\"date\" value=\"{{ closedDate }}\" sc-camel-on-change=\"{{ onFieldChange }}\" data-field=\"closedDate\" style=\"width:100%;border:1px solid #d7dfe7;border-radius:5px;background:#fff;color:#23374e;outline:0;padding:9px 10px;font-size:12px;min-height:37px;font-family:inherit;box-sizing:border-box\">\n<div style=\"font-size:9px;color:#8a97a5;margin-top:2px\">{{ closedDateFull }}<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<label style=\"display:block;font-weight:700;color:#2b4057;font-size:10.5px;margin-bottom:4px\">Reopens on *<\u002Flabel>\n<input type=\"date\" value=\"{{ reopenDate }}\" sc-camel-on-change=\"{{ onFieldChange }}\" data-field=\"reopenDate\" style=\"width:100%;border:1px solid #d7dfe7;border-radius:5px;background:#fff;color:#23374e;outline:0;padding:9px 10px;font-size:12px;min-height:37px;font-family:inherit;box-sizing:border-box\">\n<div style=\"font-size:9px;color:#8a97a5;margin-top:2px\">{{ reopenDateFull }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<!-- Date warnings -->\n<sc-if value=\"{{ dateWarning }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"background:#fef7ed;border:1px solid #f0d9b5;border-radius:5px;padding:8px 10px;font-size:10px;line-height:1.5;color:#8a6d2b;margin-bottom:10px\">{{ dateWarningText }}<\u002Fdiv>\n<\u002Fsc-if>\n<!-- Payment cut-off -->\n<label style=\"display:flex;align-items:flex-start;gap:9px;font-size:10.5px;line-height:1.5;background:#f5f7f8;border:1px solid #edf0f3;padding:10px;border-radius:6px;cursor:pointer;margin-bottom:10px\">\n<input type=\"checkbox\" checked=\"{{ showCutoff }}\" sc-camel-on-change=\"{{ onToggle }}\" data-field=\"showCutoff\" style=\"width:14px;height:14px;margin:2px 0 0;accent-color:#0B1829;flex:none\">\n<span><strong style=\"color:#233951;font-size:10.5px\">Include advance payment planning date<\u002Fstrong><\u002Fspan>\n<\u002Flabel>\n<sc-if value=\"{{ showCutoff }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px\">\n<div>\n<label style=\"display:block;font-weight:700;color:#2b4057;font-size:10.5px;margin-bottom:4px\">By date<\u002Flabel>\n<input type=\"date\" value=\"{{ cutoffDate }}\" sc-camel-on-change=\"{{ onFieldChange }}\" data-field=\"cutoffDate\" style=\"width:100%;border:1px solid #d7dfe7;border-radius:5px;background:#fff;color:#23374e;outline:0;padding:9px 10px;font-size:12px;min-height:37px;font-family:inherit;box-sizing:border-box\">\n<\u002Fdiv>\n<div>\n<label style=\"display:block;font-weight:700;color:#2b4057;font-size:10.5px;margin-bottom:4px\">Time (optional)<\u002Flabel>\n<input type=\"text\" value=\"{{ cutoffNote }}\" sc-camel-on-change=\"{{ onFieldChange }}\" data-field=\"cutoffNote\" placeholder=\"e.g. 14:00\" style=\"width:100%;border:1px solid #d7dfe7;border-radius:5px;background:#fff;color:#23374e;outline:0;padding:9px 10px;font-size:12px;min-height:37px;font-family:inherit;box-sizing:border-box\">\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Ffieldset>\n<!-- ADVANCED TOGGLE -->\n<div style=\"margin-bottom:14px\">\n<button sc-camel-on-click=\"{{ toggleAdvanced }}\" style=\"cursor:pointer;border:1px solid #dde3ea;border-radius:6px;padding:9px 12px;color:#4a6580;background:#f9fafb;font-weight:700;font-size:10.5px;width:100%;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px\">\n{{ advancedLabel }}\n<\u002Fbutton>\n<\u002Fdiv>\n<sc-if value=\"{{ showAdvanced }}\" hint-placeholder-val=\"{{ false }}\">\n<!-- Subject & Message -->\n<fieldset style=\"border:0;margin:0 0 16px;padding:0\">\n<legend style=\"padding:0;display:block;width:100%;border-bottom:1px solid #e9ebee;padding-bottom:7px;margin-bottom:12px;color:#1a2f46;font-weight:800;font-size:10px;letter-spacing:1.8px;text-transform:uppercase\">Message<\u002Flegend>\n<div style=\"margin-bottom:10px\">\n<label style=\"display:block;font-weight:700;color:#2b4057;font-size:10.5px;margin-bottom:4px\">Email subject<\u002Flabel>\n<input type=\"text\" value=\"{{ subject }}\" sc-camel-on-change=\"{{ onFieldChange }}\" data-field=\"subject\" placeholder=\"Auto-generated\" style=\"width:100%;border:1px solid #d7dfe7;border-radius:5px;background:#fff;color:#23374e;outline:0;padding:9px 10px;font-size:12px;min-height:37px;font-family:inherit;box-sizing:border-box\">\n<\u002Fdiv>\n<div style=\"margin-bottom:10px\">\n<label style=\"display:block;font-weight:700;color:#2b4057;font-size:10.5px;margin-bottom:4px\">Headline<\u002Flabel>\n<input type=\"text\" value=\"{{ headline }}\" sc-camel-on-change=\"{{ onFieldChange }}\" data-field=\"headline\" placeholder=\"Auto-generated\" style=\"width:100%;border:1px solid #d7dfe7;border-radius:5px;background:#fff;color:#23374e;outline:0;padding:9px 10px;font-size:12px;min-height:37px;font-family:inherit;box-sizing:border-box\">\n<\u002Fdiv>\n<div style=\"margin-bottom:10px\">\n<label style=\"display:block;font-weight:700;color:#2b4057;font-size:10.5px;margin-bottom:4px\">Occasion message<\u002Flabel>\n<textarea value=\"{{ intro }}\" sc-camel-on-change=\"{{ onFieldChange }}\" data-field=\"intro\" placeholder=\"Auto-generated\" style=\"width:100%;border:1px solid #d7dfe7;border-radius:5px;background:#fff;color:#23374e;outline:0;padding:9px 10px;font-size:12px;min-height:60px;line-height:1.5;resize:vertical;font-family:inherit;box-sizing:border-box\"><\u002Ftextarea>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px\">\n<div>\n<label style=\"display:block;font-weight:700;color:#2b4057;font-size:10.5px;margin-bottom:4px\">Location<\u002Flabel>\n<input type=\"text\" value=\"{{ location }}\" sc-camel-on-change=\"{{ onFieldChange }}\" data-field=\"location\" style=\"width:100%;border:1px solid #d7dfe7;border-radius:5px;background:#fff;color:#23374e;outline:0;padding:9px 10px;font-size:12px;min-height:37px;font-family:inherit;box-sizing:border-box\">\n<\u002Fdiv>\n<div>\n<label style=\"display:block;font-weight:700;color:#2b4057;font-size:10.5px;margin-bottom:4px\">Closing message<\u002Flabel>\n<input type=\"text\" value=\"{{ closing }}\" sc-camel-on-change=\"{{ onFieldChange }}\" data-field=\"closing\" style=\"width:100%;border:1px solid #d7dfe7;border-radius:5px;background:#fff;color:#23374e;outline:0;padding:9px 10px;font-size:12px;min-height:37px;font-family:inherit;box-sizing:border-box\">\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-bottom:10px\">\n<label style=\"display:block;font-weight:700;color:#2b4057;font-size:10.5px;margin-bottom:4px\">Payment guidance<\u002Flabel>\n<textarea value=\"{{ guidance }}\" sc-camel-on-change=\"{{ onFieldChange }}\" data-field=\"guidance\" style=\"width:100%;border:1px solid #d7dfe7;border-radius:5px;background:#fff;color:#23374e;outline:0;padding:9px 10px;font-size:12px;min-height:60px;line-height:1.5;resize:vertical;font-family:inherit;box-sizing:border-box\"><\u002Ftextarea>\n<\u002Fdiv>\n<\u002Ffieldset>\n\n<!-- Contacts -->\n<fieldset style=\"border:0;margin:0 0 16px;padding:0\">\n<legend style=\"padding:0;display:block;width:100%;border-bottom:1px solid #e9ebee;padding-bottom:7px;margin-bottom:12px;color:#1a2f46;font-weight:800;font-size:10px;letter-spacing:1.8px;text-transform:uppercase\">Contact details<\u002Flegend>\n<sc-for list=\"{{ contacts }}\" as=\"contact\" hint-placeholder-count=\"1\">\n<div style=\"margin-bottom:8px;padding:10px;background:#f9fafb;border:1px solid #edf0f3;border-radius:6px\">\n<div style=\"display:grid;grid-template-columns:100px 1fr;gap:7px\">\n<div>\n<sc-raw-select value=\"{{ contact.type }}\" sc-camel-on-change=\"{{ contact.onTypeChange }}\" style=\"width:100%;border:1px solid #d7dfe7;border-radius:4px;background:#fff;color:#23374e;outline:0;padding:7px 6px;font-size:11px;min-height:34px;cursor:pointer;font-family:inherit\">\n<option value=\"email\">Email<\u002Foption>\n<option value=\"phone\">Phone<\u002Foption>\n<option value=\"other\">Other<\u002Foption>\n<\u002Fsc-raw-select>\n<\u002Fdiv>\n<div style=\"display:flex;gap:6px\">\n<input type=\"text\" value=\"{{ contact.value }}\" sc-camel-on-change=\"{{ contact.onValueChange }}\" placeholder=\"{{ contact.placeholder }}\" style=\"flex:1;border:1px solid #d7dfe7;border-radius:4px;background:#fff;color:#23374e;outline:0;padding:7px 8px;font-size:11px;min-height:34px;font-family:inherit;box-sizing:border-box\">\n<sc-if value=\"{{ contact.removable }}\" hint-placeholder-val=\"{{ false }}\">\n<button sc-camel-on-click=\"{{ contact.onRemove }}\" style=\"cursor:pointer;border:1px solid #e8c8c8;background:#fdf5f5;color:#af4b3a;font-size:9px;font-weight:700;padding:4px 8px;border-radius:4px;font-family:inherit;white-space:nowrap\">✕<\u002Fbutton>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<button sc-camel-on-click=\"{{ onAddContact }}\" style=\"cursor:pointer;border:1px dashed #c5cdd7;border-radius:5px;padding:7px 10px;color:#4a6580;background:#f9fafb;font-weight:700;font-size:10px;width:100%;font-family:inherit\">+ Add contact<\u002Fbutton>\n<\u002Ffieldset>\n<!-- Promo -->\n<fieldset style=\"border:0;margin:0 0 16px;padding:0\">\n<legend style=\"padding:0;display:block;width:100%;border-bottom:1px solid #e9ebee;padding-bottom:7px;margin-bottom:12px;color:#1a2f46;font-weight:800;font-size:10px;letter-spacing:1.8px;text-transform:uppercase\">ARIE in Focus<\u002Flegend>\n<label style=\"display:flex;align-items:flex-start;gap:9px;font-size:10.5px;line-height:1.5;background:#f5f7f8;border:1px solid #edf0f3;padding:10px;border-radius:6px;cursor:pointer;margin-bottom:10px\">\n<input type=\"checkbox\" checked=\"{{ showPromo }}\" sc-camel-on-change=\"{{ onToggle }}\" data-field=\"showPromo\" style=\"width:14px;height:14px;margin:2px 0 0;accent-color:#0B1829;flex:none\">\n<span><strong style=\"color:#233951;font-size:10.5px\">Include \"ARIE in Focus\" section<\u002Fstrong><br><span style=\"color:#7a8da3;font-size:9.5px\">Enabled by default. A theme is auto-selected per holiday.<\u002Fspan><\u002Fspan>\n<\u002Flabel>\n<sc-if value=\"{{ showPromo }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"margin-bottom:10px\">\n<label style=\"display:block;font-weight:700;color:#2b4057;font-size:10.5px;margin-bottom:4px\">Content theme<\u002Flabel>\n<sc-raw-select value=\"{{ promoThemeId }}\" sc-camel-on-change=\"{{ onPromoThemeChange }}\" style=\"width:100%;border:1px solid #d7dfe7;border-radius:5px;background:#fff;color:#23374e;outline:0;padding:9px 10px;font-size:12px;min-height:38px;cursor:pointer;font-family:inherit\">\n<sc-for list=\"{{ promoThemes }}\" as=\"theme\" hint-placeholder-count=\"4\">\n<option value=\"{{ theme.id }}\">{{ theme.headline }}<\u002Foption>\n<\u002Fsc-for>\n<\u002Fsc-raw-select>\n<\u002Fdiv>\n<div style=\"margin-bottom:8px\">\n<label style=\"display:block;font-weight:700;color:#2b4057;font-size:10.5px;margin-bottom:4px\">Headline<\u002Flabel>\n<input type=\"text\" value=\"{{ promoHeadline }}\" sc-camel-on-change=\"{{ onFieldChange }}\" data-field=\"promoHeadline\" placeholder=\"Service benefit headline\" style=\"width:100%;border:1px solid #d7dfe7;border-radius:5px;background:#fff;color:#23374e;outline:0;padding:9px 10px;font-size:12px;min-height:37px;font-family:inherit;box-sizing:border-box\">\n<\u002Fdiv>\n<div style=\"margin-bottom:8px\">\n<label style=\"display:block;font-weight:700;color:#2b4057;font-size:10.5px;margin-bottom:4px\">Description<\u002Flabel>\n<textarea value=\"{{ promoCopy }}\" sc-camel-on-change=\"{{ onFieldChange }}\" data-field=\"promoCopy\" placeholder=\"Service benefit description\" style=\"width:100%;border:1px solid #d7dfe7;border-radius:5px;background:#fff;color:#23374e;outline:0;padding:9px 10px;font-size:12px;min-height:50px;line-height:1.5;resize:vertical;font-family:inherit;box-sizing:border-box\"><\u002Ftextarea>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:9px\">\n<div>\n<label style=\"display:block;font-weight:700;color:#2b4057;font-size:10.5px;margin-bottom:4px\">CTA label<\u002Flabel>\n<input type=\"text\" value=\"{{ promoLink }}\" sc-camel-on-change=\"{{ onFieldChange }}\" data-field=\"promoLink\" placeholder=\"Link label\" style=\"width:100%;border:1px solid #d7dfe7;border-radius:5px;background:#fff;color:#23374e;outline:0;padding:9px 10px;font-size:12px;min-height:37px;font-family:inherit;box-sizing:border-box\">\n<\u002Fdiv>\n<div>\n<label style=\"display:block;font-weight:700;color:#2b4057;font-size:10.5px;margin-bottom:4px\">CTA URL<\u002Flabel>\n<input type=\"text\" value=\"{{ promoURL }}\" sc-camel-on-change=\"{{ onFieldChange }}\" data-field=\"promoURL\" placeholder=\"https://...\" style=\"width:100%;border:1px solid #d7dfe7;border-radius:5px;background:#fff;color:#23374e;outline:0;padding:9px 10px;font-size:12px;min-height:37px;font-family:inherit;box-sizing:border-box\">\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-size:9px;color:#8a97a5;margin-top:4px\">UTM tracking parameters are added automatically.<\u002Fdiv>\n<sc-if value=\"{{ promoWarning }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"background:#fef7ed;border:1px solid #f0d9b5;border-radius:5px;padding:7px 10px;font-size:10px;line-height:1.5;color:#8a6d2b;margin-top:8px\">{{ promoWarningText }}<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fsc-if>\n<\u002Ffieldset>\n<!-- Share line -->\n<label style=\"display:flex;align-items:flex-start;gap:9px;font-size:10.5px;line-height:1.5;background:#f5f7f8;border:1px solid #edf0f3;padding:10px;border-radius:6px;cursor:pointer;margin-bottom:16px\">\n<input type=\"checkbox\" checked=\"{{ showShare }}\" sc-camel-on-change=\"{{ onToggle }}\" data-field=\"showShare\" style=\"width:14px;height:14px;margin:2px 0 0;accent-color:#0B1829;flex:none\">\n<span><strong style=\"color:#233951;font-size:10.5px\">Include \"share with your team\" line<\u002Fstrong><br><span style=\"color:#7a8da3;font-size:9.5px\">Encourages recipients to forward to finance/operations colleagues.<\u002Fspan><\u002Fspan>\n<\u002Flabel>\n<!-- Regulatory -->\n<fieldset style=\"border:0;margin:0 0 14px;padding:0\">\n<legend style=\"padding:0;display:block;width:100%;border-bottom:1px solid #e9ebee;padding-bottom:7px;margin-bottom:12px;color:#1a2f46;font-weight:800;font-size:10px;letter-spacing:1.8px;text-transform:uppercase\">Compliance<\u002Flegend>\n<textarea value=\"{{ regText }}\" sc-camel-on-change=\"{{ onFieldChange }}\" data-field=\"regText\" style=\"width:100%;border:1px solid #d7dfe7;border-radius:5px;background:#fff;color:#23374e;outline:0;padding:9px 10px;font-size:11px;min-height:48px;line-height:1.5;resize:vertical;font-family:inherit;box-sizing:border-box\"><\u002Ftextarea>\n<div style=\"font-size:9px;color:#8a97a5;margin-top:2px\">Use only wording approved by Compliance.<\u002Fdiv>\n<\u002Ffieldset>\n<\u002Fsc-if>\n<\u002Fdiv>\n<!-- Actions -->\n<div style=\"position:sticky;bottom:0;background:white;border-top:1px solid #e8edf1;padding:12px 20px 14px;z-index:10\">\n<sc-if value=\"{{ imageConfigMissing }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"background:#fef7ed;border:1px solid #f0d9b5;border-radius:5px;padding:8px 10px;font-size:9.5px;line-height:1.5;color:#8a6d2b;margin-bottom:8px\"><strong>Image hosting:<\u002Fstrong> Production image URLs not configured. Email will use embedded Base64 images (~500 KB). Set hosted URLs in ARIE_IMAGE_CONFIG for lighter emails.<\u002Fdiv>\n<\u002Fsc-if>\n<div style=\"font-size:9.5px;color:#7a8da3;line-height:1.5;margin-bottom:8px\">1. Copy subject → 2. Paste into new Outlook message subject → 3. Copy email → 4. Paste into body<\u002Fdiv>\n<div style=\"display:flex;gap:8px;margin-bottom:8px\">\n<button sc-camel-on-click=\"{{ onCopySubject }}\" disabled=\"{{ subjectCopyDisabled }}\" style=\"cursor:pointer;border:1px solid #cbd5e1;border-radius:6px;padding:10px 14px;color:#193149;background:white;font-weight:700;font-size:10.5px;font-family:inherit;white-space:nowrap\">1. Copy subject<\u002Fbutton>\n<button sc-camel-on-click=\"{{ onCopy }}\" disabled=\"{{ copyDisabled }}\" style=\"cursor:pointer;border:1px solid #0B1829;border-radius:6px;padding:10px 10px;color:#f6f5f2;background:#0B1829;font-weight:700;font-size:11.5px;flex:1;font-family:inherit\">2. Copy formatted email<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n<button sc-camel-on-click=\"{{ onDownload }}\" disabled=\"{{ copyDisabled }}\" style=\"cursor:pointer;border:1px solid #cbd5e1;border-radius:6px;padding:9px 12px;color:#193149;background:white;font-weight:700;font-size:10.5px;font-family:inherit\">Save HTML<\u002Fbutton>\n<button sc-camel-on-click=\"{{ onReset }}\" style=\"cursor:pointer;border:1px solid #cbd5e1;border-radius:6px;padding:9px 12px;color:#193149;background:white;font-weight:700;font-size:10.5px;font-family:inherit\">Reset<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"font-size:10.5px;min-height:14px;margin-top:8px;font-weight:700;line-height:1.5;color:{{ statusColor }}\">{{ statusMsg }}<\u002Fdiv>\n<div style=\"font-size:10.5px;line-height:1.5;color:#68798b;margin-top:3px\">{{ readinessMsg }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<!-- PREVIEW -->\n<div class=\"arie-preview-area\" style=\"position:sticky;top:20px;min-width:0\">\n<div style=\"display:flex;justify-content:space-between;align-items:center;margin:0 0 10px;gap:10px\">\n<div style=\"color:#10253c;font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase\">Live preview<\u002Fdiv>\n<div style=\"font-size:9px;color:#7a8da3;letter-spacing:.4px;max-width:280px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ subjectPreview }}<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:#fff;border:1px solid #dce3e9;border-radius:8px;overflow:hidden;box-shadow:0 10px 32px rgba(14,33,53,.06)\">\n<div style=\"padding:18px 12px 24px;background:#e6eaee;overflow-x:auto\">\n<div ref=\"{{ previewRef }}\" style=\"max-width:640px;margin:auto;box-shadow:0 4px 24px rgba(11,28,45,.08);background:white;overflow:hidden\"><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:10px 16px;background:#fff;font-size:9px;color:#7b8794;line-height:1.5;border-top:1px solid #e6ebf0\">Paste the copied email into a new Outlook message. Send one test before distributing.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  previewRef = React.createRef();\n  state = {\n    occasion: '', customOccasion: '', subject: '', headline: '',\n    location: 'Mauritius', intro: '', closedDate: '', reopenDate: '',\n    cutoffDate: '', cutoffNote: '',\n    guidance: 'Please submit time-sensitive payment instructions through your usual authorised channel in advance of the closure, allowing for applicable processing cut-off times. Processing and settlement remain subject to normal checks and banking partner schedules.',\n    contacts: [{ type: 'email', value: 'customercare@ariefinance.com' }],\n    closing: 'Thank you for your understanding and continued trust.',\n    showCutoff: false, showPromo: true, showShare: true, showReg: true,\n    regText: 'ARIE Finance Ltd is a licensed Payment Intermediary Services company regulated by the Financial Services Commission of Mauritius. Licence No. GB25205028.',\n    promoThemeId: '', promoHeadline: '', promoCopy: '', promoLink: '', promoURL: '',\n    subjectEdited: false,\n    statusMsg: '', statusOk: true, showAdvanced: false\n  };\n  componentDidMount() { this.updatePreview(); }\n  componentDidUpdate() { this.updatePreview(); }\n  updatePreview() {\n    if (this.previewRef.current && typeof window.arieBuildEmail === 'function') {\n      var cfg = Object.assign({}, this.getConfig(), { _includePreheader: true });\n      this.previewRef.current.innerHTML = window.arieBuildEmail(cfg);\n    }\n  }\n  getConfig() {\n    var s = this.state;\n    return {\n      occasion: s.occasion, customOccasion: s.customOccasion,\n      subject: s.subject, headline: s.headline, location: s.location,\n      intro: s.intro, closedDate: s.closedDate, reopenDate: s.reopenDate,\n      cutoffDate: s.cutoffDate, cutoffNote: s.cutoffNote, guidance: s.guidance,\n      contacts: s.contacts, email: (s.contacts[0] || {}).value || '',\n      closing: s.closing, showShare: s.showShare,\n      showCutoff: s.showCutoff, showPromo: s.showPromo, showReg: s.showReg,\n      regText: s.regText, promoHeadline: s.promoHeadline,\n      promoCopy: s.promoCopy, promoLink: s.promoLink, promoURL: s.promoURL,\n      promoThemeId: s.promoThemeId\n    };\n  }\n  applyPromoTheme(themeId) {\n    var themes = window.ARIE_PROMO_THEMES || [];\n    var theme = themes.find(function(t){ return t.id === themeId; }) || themes[0];\n    if (!theme) return {};\n    return { promoThemeId: theme.id, promoHeadline: theme.headline, promoCopy: theme.copy, promoLink: theme.cta, promoURL: theme.url };\n  }\n  verifyInputs() {\n    var s = this.state, errors = [];\n    if (!s.occasion) errors.push('Choose a holiday');\n    if (s.occasion === 'Other' && !s.customOccasion.trim()) errors.push('Enter the custom occasion name');\n    if (!s.closedDate || !s.reopenDate) errors.push('Enter closure and reopening dates');\n    else if (s.reopenDate <= s.closedDate) errors.push('Reopening must be after the closure');\n    if (s.showCutoff) {\n      if (!s.cutoffDate) errors.push('Enter the cut-off date or switch it off');\n      else if (s.closedDate && s.cutoffDate >= s.closedDate) errors.push('Cut-off must be before closure');\n    }\n    if (s.occasion && (!s.subject || !s.headline || !s.intro)) errors.push('Subject, headline and message are required');\n    if (!s.contacts.length || !s.contacts[0].value.trim()) errors.push('Enter at least one contact');\n    s.contacts.forEach(function(c, i) {\n      if (c.type === 'email' && c.value.trim() && !/^[^\\s@<>]+@[^\\s@<>]+\\.[^\\s@<>]+$/.test(c.value.trim())) errors.push('Contact ' + (i+1) + ': invalid email');\n      if (c.type === 'phone' && c.value.trim() && c.value.trim().length < 5) errors.push('Contact ' + (i+1) + ': invalid phone');\n    });\n    if (s.showPromo) {\n      if (!s.promoHeadline.trim()) errors.push('Promo headline is required');\n      if (!s.promoCopy.trim()) errors.push('Promo description is required');\n      try { var u = new URL(s.promoURL); if (!['https:','http:'].includes(u.protocol)) throw 0; }\n      catch(ex) { errors.push('Enter a valid promo URL or disable the section'); }\n    }\n    return errors;\n  }\n  checkDateWarnings() {\n    var s = this.state, warnings = [];\n    var today = new Date().toISOString().split('T')[0];\n    if (s.closedDate && s.closedDate < today) warnings.push('Closure date is in the past');\n    if (s.reopenDate && s.reopenDate < today) warnings.push('Reopening date is in the past');\n    if (s.showCutoff && s.cutoffDate && s.cutoffDate < today) warnings.push('Cut-off date is in the past');\n    return warnings;\n  }\n  renderVals() {\n    var self = this;\n    var s = this.state;\n    var errors = this.verifyInputs();\n    var complete = errors.length === 0;\n    var dateWarnings = this.checkDateWarnings();\n    var fmtDate = typeof window.arieFormatDate === 'function' ? window.arieFormatDate : function(){ return ''; };\n    var readiness = complete\n      ?
