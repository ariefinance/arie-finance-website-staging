<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="/internal/systems/">
<meta name="robots" content="noindex, nofollow">
<title>ARIE Finance — ARIE Systems</title>
<link rel="icon" href="data:,">
<style>
  :root { --navy:#091626; --navy2:#0d1f33; --line:#1e3350; --gold:#c5a572; --ink:#f5f2ec; --muted:#8fa0b4; }
  html, body { margin:0; padding:0; height:100%; background:var(--navy); color:var(--ink); font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; }
  body.locked { overflow:hidden; }
  .gate { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:var(--navy); z-index:1000; }
  .gate.hidden { display:none; }
  .gate-card { background:var(--navy2); border:1px solid var(--line); border-radius:8px; padding:28px 32px; width:min(380px, calc(100% - 32px)); box-shadow:0 2px 12px rgba(0,0,0,.3); }
  .gate-card h1 { margin:0 0 6px; font:600 18px/1.3 "Playfair Display",Georgia,serif; color:var(--gold); letter-spacing:.5px; }
  .gate-card p  { margin:0 0 18px; font-size:12px; color:var(--muted); }
  .gate-card label { display:block; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1.5px; margin-bottom:6px; }
  .gate-card input { width:100%; padding:10px 12px; background:var(--navy); color:var(--ink); border:1px solid var(--line); border-radius:4px; font-size:14px; box-sizing:border-box; }
  .gate-card input:focus { outline:none; border-color:var(--gold); }
  .gate-card button { margin-top:14px; width:100%; padding:10px 14px; background:var(--gold); color:var(--navy); border:0; border-radius:4px; font-weight:700; font-size:13px; letter-spacing:.5px; cursor:pointer; }
  .gate-card button[disabled] { opacity:.6; cursor:not-allowed; }
  .gate-err { min-height:16px; margin-top:10px; font-size:12px; color:#ff8a80; }
  .gate-foot { margin-top:16px; font-size:11px; color:var(--muted); }
  iframe#studio { position:fixed; inset:0; width:100%; height:100%; border:0; background:#eef0f4; }
  #signout { position:fixed; top:12px; right:14px; z-index:5; padding:4px 10px; font:600 10px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; letter-spacing:1.5px; text-transform:uppercase; color:#8fa0b4; background:rgba(9,22,38,.78); border:1px solid #1e3350; border-radius:3px; cursor:pointer; backdrop-filter:blur(4px); }
  #signout:hover { color:var(--gold); border-color:var(--gold); }
  #signout.hidden { display:none; }
</style>
</head>
<body class="locked">

<div class="gate" id="gate">
  <div class="gate-card">
    <h1>ARIE Systems</h1>
    <p>Staff-only tool. Enter the access passcode to continue.</p>
    <form id="gateForm" autocomplete="off">
      <label for="gatePass">Access passcode</label>
      <input id="gatePass" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Enter passcode">
      <button type="submit" id="gateBtn">Sign in</button>
      <div class="gate-err" id="gateErr" role="alert" aria-live="polite"></div>
    </form>
    <div class="gate-foot">Sessions expire after 12 hours. Nothing you compose leaves your browser.</div>
  </div>
</div>

<iframe id="studio" title="ARIE Systems" style="display:none"></iframe>
<button id="signout" class="hidden" type="button" title="End your 12-hour staff session">Sign out</button>

<script>
(function () {
  var API = "/api/internal/systems";
  function api(opts) {
    opts = opts || {};
    var init = { method: opts.method || "GET", headers: { "Content-Type": "application/json" }, credentials: "same-origin" };
    if (opts.body) init.body = JSON.stringify(opts.body);
    return fetch(API + (opts.query || ""), init).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) { var e = new Error(j.error || ("http_" + r.status)); e.code = j.error; e.status = r.status; throw e; }
        return j;
      });
    });
  }
  var gate = document.getElementById("gate");
  var errEl = document.getElementById("gateErr");
  var studio = document.getElementById("studio");
  var signout = document.getElementById("signout");
  function showGate(msg) {
    gate.classList.remove("hidden"); document.body.classList.add("locked");
    studio.style.display = "none"; studio.src = "about:blank";
    signout.classList.add("hidden");
    if (msg != null) errEl.textContent = msg;
    var p = document.getElementById("gatePass");
    if (p) { p.value = ""; try { p.focus(); } catch (e) {} }
  }
  function openStudio() {
    gate.classList.add("hidden"); document.body.classList.remove("locked");
    studio.style.display = "block";
    signout.classList.remove("hidden");
    if (studio.src.indexOf("studio.html") < 0) studio.src = "studio.html";
  }
  signout.addEventListener("click", function () {
    signout.disabled = true;
    api({ method: "POST", body: { action: "logout" } })
      .catch(function () {})
      .then(function () { location.reload(); });
  });
  document.getElementById("gateForm").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var btn = document.getElementById("gateBtn"), pass = document.getElementById("gatePass").value;
    if (!pass) { errEl.textContent = "Enter the passcode."; return; }
    btn.disabled = true; var old = btn.textContent; btn.textContent = "Signing in…"; errEl.textContent = "";
    api({ method: "POST", body: { action: "login", passcode: pass } })
      .then(openStudio)
      .catch(function (err) {
        errEl.textContent = err.code === "invalid_passcode" ? "Incorrect passcode."
          : err.code === "passcode_unconfigured" ? "Not configured yet — contact the administrator."
          : "Could not sign in. Please try again.";
      })
      .then(function () { btn.disabled = false; btn.textContent = old; });
  });
  api({ method: "GET", query: "?action=session" }).then(openStudio).catch(function () { showGate(""); });
})();
</script>
</body>
</html>
